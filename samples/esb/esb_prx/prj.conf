CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_ESB=y
CONFIG_DK_LIBRARY=y
CONFIG_ESB_FAST_SWITCHING=y
CONFIG_ESB_FAST_CHANNEL_SWITCHING=y
CONFIG_ESB_PRX_TX_LENGTH=5


# USB STACK NEXT
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
#CONFIG_USBD_HID_IN_BUF_COUNT=1024
CONFIG_USBD_HID_IN_BUF_COUNT=256
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_UDC_BUF_COUNT=64
CONFIG_USBD_MAX_UDC_MSG=256

CONFIG_SAMPLE_USBD_PID=0x0006
CONFIG_SAMPLE_USBD_MANUFACTURER="Nordic Semiconductor"
CONFIG_SAMPLE_USBD_PRODUCT="nRF54LM20 HID"
CONFIG_NRFS_VBUS_DETECTOR_SERVICE_ENABLED=y

CONFIG_HWINFO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_SPIN_VALIDATE=n
CONFIG_PM=n

# CPU usage
#CONFIG_LOG_BACKEND_UART=y
##CONFIG_LOG_BACKEND_RTT=y
#CONFIG_THREAD_ANALYZER=y
##CONFIG_THREAD_ANALYZER_USE_PRINTK=y
#CONFIG_THREAD_ANALYZER_AUTO=y
#CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
#CONFIG_THREAD_NAME=y
#CONFIG_LOG_BUFFER_SIZE=12048
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
